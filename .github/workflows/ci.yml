name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and debug build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Reject local reference material and credentials
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(ref/|.*\.(zip|jks|keystore|p12|pem|apk))$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden local material is tracked:"
            echo "$forbidden"
            exit 1
          fi

      - name: Run tests, static checks, and debug build
        run: gradle --no-daemon test lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: moonan-english-debug-${{ github.sha }}
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14

  device-tests:
    name: Device tests (API ${{ matrix.api-level }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 34, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Upload device-test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: device-test-report-api-${{ matrix.api-level }}-${{ github.sha }}
          path: app/build/reports/androidTests/connected/debug/
          if-no-files-found: ignore
          retention-days: 14
